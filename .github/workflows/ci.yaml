name: C++ CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        run: python -m pip install "cmake>=4.3.2"

      - name: Check CMake version
        run: cmake --version

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build