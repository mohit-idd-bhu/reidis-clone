name: C++ CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@v4
        with:
          cmakeVersion: 4.3.2

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build